<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Rounded square badge background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- Machine body -->
  <rect x="96" y="104" width="320" height="320" rx="28" fill="#ffffff" opacity="0.16"/>
  <rect x="96" y="104" width="320" height="320" rx="28" fill="none" stroke="#ffffff" opacity="0.6" stroke-width="6"/>

  <!-- Control dots -->
  <circle cx="140" cy="146" r="9" fill="#ffffff"/>
  <circle cx="172" cy="146" r="9" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Drum -->
  <circle cx="256" cy="288" r="112" fill="url(#drum)"/>
  <circle cx="256" cy="288" r="112" fill="none" stroke="#3b82f6" stroke-width="10"/>

  <!-- Water/wave swirl inside drum -->
  <path d="M174 300c20-26 44-26 64 0s44 26 64 0 44-26 64 0"
        fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
  <path d="M174 332c20-26 44-26 64 0s44 26 64 0 44-26 64 0"
        fill="none" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <!-- Bubble accents -->
  <circle cx="340" cy="210" r="10" fill="#ffffff"/>
  <circle cx="364" cy="236" r="6" fill="#ffffff" opacity="0.8"/>
</svg>
